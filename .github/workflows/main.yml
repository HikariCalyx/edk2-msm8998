# Builds edk2-msm8998 for a single device.
#
# Fork notes:
#   - limited to nb1; add codenames under `matrix.device` to build more
#   - runner is pinned to ubuntu-22.04: ubuntu-latest is 24.04, which removed
#     python3-distutils and therefore breaks EDK2 BaseTools / edksetup.sh
#   - actions/upload-artifact must stay on v4; GitHub retired the v3 backend in Jan 2025

name: CI

on:
  push:
    branches: [new]
  workflow_dispatch:

# a new push cancels an in-flight build for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Image Build
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        device:
          - nb1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential uuid-dev iasl nasm gcc-aarch64-linux-gnu python3-distutils python3-pil python3-git gettext

      - name: Build device ${{ matrix.device }}
        run: |
          ./build.sh --device ${{ matrix.device }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.device }}
          path: boot-${{ matrix.device }}.img
          if-no-files-found: error
