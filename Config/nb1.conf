# Device Name
VENDOR_NAME="nokia"

# Path used to compile ACPI during the generation process
DSDT_FILE="Platforms/Msm8998ACPI/nokia/nb1/dsdt.asl"

# Generate Boot Configuration
#
# These mirror NB1's stock boot image, which is what this bootloader accepts via
# `fastboot boot`. Declaring Android 12 / header_version 1 (the shared defaults,
# inherited from mata) is rejected with "BootImage is Incomplete"; the stock image
# is Android 9.0.0, patch 2020-10, header_version 0.
BOOTIMG_OS_VERSION=9.0.0
BOOTIMG_OS_PATCH_LEVEL="2020-10"
BOOTIMG_HEADER_VERSION=0
